services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: device_monitoring
      POSTGRES_USER: device_monitoring_user
      POSTGRES_PASSWORD: device_monitoring_pass
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device_monitoring_user -d device_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: device_monitoring
      DB_USER: device_monitoring_user
      DB_PASSWORD: device_monitoring_pass
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: